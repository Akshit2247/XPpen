[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xppen"
version = "1.0.0"
authors = [
  { name="xppen-coder", email="dev@xppen.local" },
]
description = "Insanely over-engineered Python digital stylus & physics pen computing suite"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pillow>=9.5.0",
]

[project.scripts]
xppen = "xppen.cli:main"
