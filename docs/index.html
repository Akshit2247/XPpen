<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>XP·PEN Digital Stylus Simulator (Mouse-Adaptive 8192 LPI)</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;user-select:none}
    body{background:#0e1014;color:#f0f2f5;height:100vh;display:flex;flex-direction:column;overflow:hidden}
    header{height:42px;background:#121318;border-bottom:1px solid #282b36;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
    .brand{font-size:14px;font-weight:800}.brand span{color:#e50012}
    .badge{background:#181a21;border:1px solid #2e3340;font-size:10px;padding:2px 8px;border-radius:3px;color:#10b981;font-family:monospace}
    .bar{height:42px;background:#15171e;border-bottom:1px solid #282b36;display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:8px;font-size:11px;font-weight:600}
    .group{display:flex;align-items:center;gap:10px}
    input[type=range]{width:70px;height:3px;accent-color:#e50012;cursor:pointer}
    .btn{background:#1f222b;border:1px solid #2f3442;color:#fff;font-size:11px;font-weight:600;padding:4px 9px;border-radius:3px;cursor:pointer}
    .btn:hover{background:#2a2e3a}.btn-red{background:#e50012;border-color:#e50012}.btn-red:hover{background:#ff1a2b}
    main{flex:1;position:relative;background:radial-gradient(circle at center,#171922 0%,#0c0d11 100%);overflow:hidden;cursor:crosshair}
    canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
    .frame{position:absolute;inset:20px;border:1px solid rgba(255,255,255,.05);border-radius:6px;pointer-events:none}
    .hud{position:absolute;bottom:14px;left:14px;display:flex;gap:8px;pointer-events:none}
    .card{background:rgba(18,20,26,.92);border:1px solid #2b2f3d;padding:5px 10px;border-radius:4px;font-size:11px;display:flex;align-items:center;gap:6px}
    .card span{color:#7f8799}.card strong{font-family:monospace;color:#fff}
    .p-track{width:90px;height:6px;background:#090a0d;border-radius:2px;overflow:hidden;border:1px solid #333}
    .p-fill{height:100%;width:0%;background:linear-gradient(90deg,#10b981,#f59e0b,#e50012)}
    .hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#363a47;font-size:12px;font-weight:700;pointer-events:none;text-align:center;line-height:1.5}
  </style>
</head>
<body>
  <header>
    <div class="brand">XP<span>·PEN</span> <small style="color:#7f8799;font-size:10px;font-weight:400">Digitizer Simulator</small></div>
    <div class="badge">● Mouse Velocity Dynamics (8192 LPI)</div>
  </header>
  <div class="bar">
    <div class="group">
      <label>Speed Sens: <input type="range" id="sens" min="0.5" max="3" step="0.1" value="1.4"></label>
      <label>Nib Spring: <input type="range" id="spk" min="0.1" max="1" step="0.05" value="0.45"></label>
      <input type="color" id="col" value="#e50012" style="width:20px;height:20px;border:none;background:none;cursor:pointer">
    </div>
    <div class="group">
      <button class="btn btn-red" id="btn-orb">⚡ Physics Orbit</button>
      <button class="btn" id="btn-und">↩ Undo</button>
      <button class="btn" id="btn-clr">🧹 Clear</button>
      <button class="btn" id="btn-exp">💾 Save SVG</button>
    </div>
  </div>
  <main>
    <canvas id="cv"></canvas>
    <div class="frame"></div>
    <div class="hint" id="hint">DRAW WITH MOUSE OR STYLUS<br><small style="color:#494f61;font-weight:500">Move slow for thick ink, flick fast for hairlines • Mouse wheel dials line weight</small></div>
    <div class="hud">
      <div class="card"><span>Pressure:</span><div class="p-track"><div class="p-fill" id="bar"></div></div><strong id="hp">0 / 8192</strong></div>
      <div class="card"><span>Speed:</span><strong id="hsp">0 px/s</strong></div>
      <div class="card"><span>Wheel:</span><strong id="hwh">1.0x</strong></div>
    </div>
  </main>
  <script>
    const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),bar=document.getElementById('bar'),hp=document.getElementById('hp'),hsp=document.getElementById('hsp'),hwh=document.getElementById('hwh'),hint=document.getElementById('hint');
    let pen={x:0,y:0,vx:0,vy:0,p:0,down:false},ms={x:0,y:0,lx:0,ly:0,lt:0,spd:0,hwP:0},wSc=1.0,strokes=[],cur=[],oAnim=null;
    function rsz(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.scale(d,d);redr()}
    window.addEventListener('resize',rsz);setTimeout(rsz,40);
    function tick(){
      const k=+document.getElementById('spk').value,sens=+document.getElementById('sens').value;
      const dx=ms.x-pen.x,dy=ms.y-pen.y;
      pen.vx+=(k*dx*60-0.38*pen.vx*30)*0.016;pen.vy+=(k*dy*60-0.38*pen.vy*30)*0.016;
      pen.x+=pen.vx*0.016;pen.y+=pen.vy*0.016;
      let tp=0;if(pen.down){tp=ms.hwP>0?ms.hwP:Math.max(0.12,Math.min(1.0,(1.0-Math.min(1.0,ms.spd/(1200/sens))*0.82)*wSc))}
      pen.p+=(pen.down?0.30:0.15)*(tp-pen.p);
      if(pen.down&&Math.hypot(dx,dy)>0.2){cur.push({x:pen.x,y:pen.y,p:pen.p,c:document.getElementById('col').value});seg(cur)}
      hp.textContent=`${Math.round(pen.p*8191)} / 8192`;bar.style.width=`${Math.round(pen.p*100)}%`;hsp.textContent=`${Math.round(ms.spd)} px/s`;hwh.textContent=`${wSc.toFixed(1)}x`;
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
    function seg(s){if(s.length<2)return;const a=s[s.length-2],b=s[s.length-1];ctx.save();ctx.strokeStyle=b.c;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=Math.max(1.5,b.p*16);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore()}
    function redr(){ctx.clearRect(0,0,cv.clientWidth,cv.clientHeight);for(const s of strokes){for(let i=1;i<s.length;i++)seg(s.slice(0,i+1))}}
    cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);hint.style.display='none';const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;ms.x=pen.x=ms.lx=x;ms.y=pen.y=ms.ly=y;ms.lt=performance.now();ms.spd=0;ms.hwP=(e.pointerType==='pen'&&e.pressure>0)?e.pressure:0;pen.down=true;pen.p=0.5*wSc;cur=[{x,y,p:pen.p,c:document.getElementById('col').value}]});
    cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,n=performance.now(),dt=Math.max(1,n-ms.lt)/1000;ms.spd=Math.hypot(x-ms.lx,y-ms.ly)/dt;ms.x=ms.lx=x;ms.y=ms.ly=y;ms.lt=n;ms.hwP=(e.pointerType==='pen'&&e.pressure>0)?e.pressure:0});
    const stop=()=>{if(pen.down&&cur.length>1)strokes.push([...cur]);pen.down=false;cur=[];ms.spd=0};cv.addEventListener('pointerup',stop);cv.addEventListener('pointercancel',stop);
    cv.addEventListener('wheel',e=>{e.preventDefault();wSc=Math.max(0.4,Math.min(2.5,wSc+(e.deltaY>0?-0.1:0.1)))},{passive:false});
    document.getElementById('btn-clr').addEventListener('click',()=>{strokes=[];cur=[];redr();hint.style.display='block'});
    document.getElementById('btn-und').addEventListener('click',()=>{if(strokes.length){strokes.pop();redr()}});
    document.getElementById('btn-orb').addEventListener('click',()=>{hint.style.display='none';if(oAnim)cancelAnimationFrame(oAnim);const cx=cv.clientWidth/2,cy=cv.clientHeight/2;let t=0;cur=[];pen.down=true;function step(){const a=t*0.038,d=Math.exp(-0.0007*t);ms.x=cx+220*Math.sin(2*a)*d;ms.y=cy+130*Math.sin(3*a+1.57)*d;ms.spd=300+400*Math.sin(a*2);t++;if(t<720)oAnim=requestAnimationFrame(step);else stop()}step()});
    document.getElementById('btn-exp').addEventListener('click',()=>{if(!strokes.length)return alert('Canvas empty!');let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${cv.clientWidth} ${cv.clientHeight}" width="${cv.clientWidth}" height="${cv.clientHeight}" style="background:#0e1014">\n`;for(const st of strokes){for(let i=1;i<st.length;i++){const a=st[i-1],b=st[i];s+=`  <line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" stroke="${b.c}" stroke-width="${Math.max(1.5,b.p*16).toFixed(1)}" stroke-linecap="round"/>\n`}}s+='</svg>';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'image/svg+xml'}));a.download='xppen_drawing.svg';a.click()});
    window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z')document.getElementById('btn-und').click()});
  </script>
</body>
</html>
